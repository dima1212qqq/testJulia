version: '3.8'

services:
  bot:
    build: .
    command: python main.py
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      - redis
      - meilisearch
      - worker

  worker:
    build: .
    # Must import app.tasks so tasks are registered
    command: taskiq worker app.broker:broker app.tasks
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      - redis
      - meilisearch

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  meilisearch:
    image: getmeili/meilisearch:v1.3
    environment:
      - MEILI_MASTER_KEY=${MEILISEARCH_KEY:-masterKey}
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data

volumes:
  meili_data:
